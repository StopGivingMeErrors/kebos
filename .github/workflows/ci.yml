name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Covers: rules, concurrency, rate limit, cors, client-ip, stats,
      # stats-cache, admin-config, upstash-env (full security suite).
      - name: Emulator and unit tests
        run: npm run test:security

      - name: Build
        run: npm run build
        env:
          CI: "true"
